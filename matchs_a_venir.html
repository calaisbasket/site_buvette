  <script>

    function updateTime() {
    const now = new Date();
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const seconds = now.getSeconds().toString().padStart(2, '0');
    document.getElementById('hours').textContent = hours;
    document.getElementById('minutes').textContent = minutes;
    }

    setInterval(updateTime, 1000);
</script>

    <script>
const iframe = document.querySelector('.widget_matchs_a_venir');

iframe.addEventListener('load', function() {
    try {
        const doc = iframe.contentWindow.document;
        const hauteurMax = doc.documentElement.scrollHeight - doc.documentElement.clientHeight;

        if (hauteurMax <= 0) return;

        const duree = 15000;
        const debut = performance.now();

        function defiler(maintenant) {
            const progression = Math.min((maintenant - debut) / duree, 1);

            iframe.contentWindow.scrollTo(
                0,
                hauteurMax * progression
            );

            if (progression < 1) {
                requestAnimationFrame(defiler);
            } else {
                setTimeout(() => {
                    iframe.contentWindow.scrollTo(0, 0);
                    setTimeout(() => {
                        location.reload();
                    }, 1000);
                }, 1000);
            }
        }

        requestAnimationFrame(defiler);

    } catch (e) {
        console.log("Défilement non autorisé par Scorenco");
    }
});
</script>

<body>

        <h1> Matchs à venir </h1>
    </div>

    <iframe class="widget_matchs_a_venir"
        id="6517d3af1628070fd6971f41"
        src="https://widgets.scorenco.com/week-events/3850">
</iframe>
